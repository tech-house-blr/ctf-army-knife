name: CodeQL

# Static security analysis of the web app, the API and these workflows.
# Results show up under Security > Code scanning.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Upstream CyberChef and its generated bundle aren't our code.
          config: |
            paths-ignore:
              - vendor/**
              - apps/web/public/tools/cyberchef/**
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
