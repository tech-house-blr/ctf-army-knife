name: CyberChef integration

# Slow (~14 min): Windows build, upstream tests and Playwright browser tests.
# Only runs when something CyberChef depends on changes; ci.yml covers the rest.
on:
  push:
    paths:
      - "vendor/cyberchef/**"
      - "integration/cyberchef/**"
      - "scripts/cyberchef*.mjs"
      - "tests/cyberchef/**"
      - "tests/browser/**"
      - "playwright.config.mjs"
      - "apps/web/app/cyberchef/**"
      - "apps/web/app/layout.tsx"
      - "apps/web/app/globals.css"
      - "apps/web/components/**"
      - "apps/web/next.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cyberchef.yml"
  pull_request:
    paths:
      - "vendor/cyberchef/**"
      - "integration/cyberchef/**"
      - "scripts/cyberchef*.mjs"
      - "tests/cyberchef/**"
      - "tests/browser/**"
      - "playwright.config.mjs"
      - "apps/web/app/cyberchef/**"
      - "apps/web/app/layout.tsx"
      - "apps/web/app/globals.css"
      - "apps/web/components/**"
      - "apps/web/next.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cyberchef.yml"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vendor/cyberchef/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            .cache/cyberchef
            apps/web/public/tools/cyberchef
          key: ${{ runner.os }}-cyberchef-node24.18.0-v1-${{ hashFiles('vendor/cyberchef/**', 'integration/cyberchef/**', 'scripts/cyberchef*.mjs') }}
      - run: npm ci
      - run: npm run test:integration
      - run: npm run lint
      - run: npm run cyberchef:setup
      - name: Upstream lint and operation tests
        if: runner.os == 'Linux'
        run: npm run cyberchef:test-upstream
      - run: npm run build
      - run: npm run cyberchef:verify
      - name: Install browser engines
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium firefox
      - name: Browser integration tests
        if: runner.os == 'Linux'
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure() && runner.os == 'Linux'
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
