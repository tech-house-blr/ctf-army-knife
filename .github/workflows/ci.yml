name: CI

# Runs on every push. The slow CyberChef suite (Windows, upstream tests,
# browser tests) lives in cyberchef.yml and only runs when its inputs change.
on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vendor/cyberchef/package-lock.json
      # Same key as cyberchef.yml, so the CyberChef bundle is normally restored
      # instead of rebuilt; npm run build only rebuilds it on a cache miss.
      - uses: actions/cache@v4
        with:
          path: |
            .cache/cyberchef
            apps/web/public/tools/cyberchef
          key: ${{ runner.os }}-cyberchef-node24.18.0-v1-${{ hashFiles('vendor/cyberchef/**', 'integration/cyberchef/**', 'scripts/cyberchef*.mjs') }}
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  # Tests that need steghide, zsteg, binwalk etc. skip on the plain runner above;
  # here they run inside the real API image, read-only like in production.
  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ctf-army-knife-api apps/api
      - name: Run API tests inside the image
        run: |
          docker run --rm -u root \
            -v "$PWD/apps/api/tests:/app/tests:ro" -v "$PWD/apps/api/pytest.ini:/app/pytest.ini:ro" \
            ctf-army-knife-api sh -c \
            "pip install -q --root-user-action=ignore pytest httpx && su api -s /bin/sh -c 'cd /app && python -m pytest -rs'"
